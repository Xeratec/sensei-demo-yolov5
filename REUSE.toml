version = 1

# Every hand-written file has its own SPDX header. These annotations cover the files that cannot carry
# one. When several match a file, the last one wins.

# Build configurations and notebooks
[[annotations]]
path = ["**/*.json", "**/*.ipynb"]
SPDX-FileCopyrightText = "2025 ETH Zurich and University of Bologna"
SPDX-License-Identifier = "Apache-2.0"

# Figures
[[annotations]]
path = ["**/*.pdf", "**/*.png"]
SPDX-FileCopyrightText = "2025 ETH Zurich and University of Bologna"
SPDX-License-Identifier = "CC-BY-4.0"

# YOLOv5 detector models and their NNTool weight tensors: trained with the YOLOv5 code (Ultralytics, AGPL-3.0)
[[annotations]]
path = ["**/*.tflite", "**/*.tensor"]
SPDX-FileCopyrightText = "2025 ETH Zurich and University of Bologna"
SPDX-License-Identifier = "AGPL-3.0-only"

# Code generated by GreenWaves NNTool and AutoTiler (templates of the GAP SDK, Apache-2.0)
[[annotations]]
path = ["src_GAP/src/networks/YOLOv5/generated*/**.c", "src_GAP/src/networks/YOLOv5/generated*/**.h"]
SPDX-FileCopyrightText = "2017 GreenWaves Technologies"
SPDX-License-Identifier = "Apache-2.0"

# Third party: calibration images from the public Roboflow dataset-human-head
# (https://universe.roboflow.com/object-detection/dataset-human-head)
[[annotations]]
path = "src_GAP/networks/YOLOv5/input_images_HeadCount/**.jpg"
SPDX-FileCopyrightText = "2023 Roboflow Universe, dataset-human-head"
SPDX-License-Identifier = "CC-BY-4.0"

# Third party: network input files
[[annotations]]
path = "src_GAP/src/networks/YOLOv5/generated*/**.bin"
SPDX-FileCopyrightText = "2023 Carlos Alberto Castro Zuleta"
SPDX-License-Identifier = "CC-BY-ND-4.0"
